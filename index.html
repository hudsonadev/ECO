<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECO - Login</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Container principal -->
  <main class="page-container">
    <!-- Card Login-->
    <div class="login-card">
      <!-- Logotipo ECO -->
      <div class="logo-wrapper">
        <img src="logo/eco_logo.png" alt="Logo ECO" class="logo-img">
      </div>

      <!-- Frase de instrução -->
      <p class="instruction-text">Preencha os dados abaixo para continuar</p>

      <!-- Formulário -->
      <form class="login-form" id="loginForm" novalidate>
        <!-- Campo CPF -->
        <div class="form-group">
          <label for="cpf" class="form-label">Digite o seu CPF</label>
          <div class="input-control">
            <span class="icon-left" aria-hidden="true">
              <!-- Ícone de Usuário -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="cpf" 
              name="cpf" 
              placeholder="CPF" 
              autocomplete="username" 
              maxlength="14" 
              inputmode="numeric"
              required
            >
          </div>
        </div>

        <!-- Campo Senha -->
        <div class="form-group">
          <label for="password" class="form-label">Digite a sua senha</label>
          <div class="input-control">
            <span class="icon-left" aria-hidden="true">
              <!-- Ícone de Cadeado -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Senha" 
              autocomplete="current-password" 
              required
            >
            <button 
              type="button" 
              class="btn-toggle-password" 
              id="togglePassword" 
              aria-label="Mostrar ou ocultar senha"
              title="Mostrar ou ocultar senha"
            >
              <!-- Ícone de Olho -->
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Link Esqueci Minha Senha -->
        <div class="form-links">
          <a href="#" class="forgot-password">Esqueci minha senha</a>
        </div>

        <!-- Botão Entrar -->
        <div class="action-wrapper">
          <button type="submit" class="btn-submit">Entrar</button>
        </div>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
